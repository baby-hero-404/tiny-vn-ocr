[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-vn-ocr"
version = "0.1.0"
description = "Lightweight Vietnamese identity document OCR system optimized for resource-constrained environments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.7.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pytesseract>=0.3.10",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "rapidfuzz>=3.0.0",
    "python-multipart>=0.0.6",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
